name: Secret scan

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the tip

      - name: Scan history for secrets
        run: |
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --redact --verbose
