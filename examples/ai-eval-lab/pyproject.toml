[project]
name = "ai-eval-lab"
version = "0.1.0"
description = "An AI evaluation and regression testing framework for investigative AI systems."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.125,<1.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.10,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.mypy]
strict = true
files = ["src", "tests"]
